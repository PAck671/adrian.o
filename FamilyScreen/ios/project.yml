name: FamilyScreen
options:
  bundleIdPrefix: com.familyscreen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  FamilyScreen:
    type: application
    platform: iOS
    sources:
      - path: FamilyScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyscreen.viewer
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FamilyScreen/Info.plist
      properties:
        CFBundleDisplayName: "Family Screen"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
