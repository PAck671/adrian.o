plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.familyscreen.sender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.familyscreen.sender'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // Android has no built-in WebSocket client
}
