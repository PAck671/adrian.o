<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'unsafe-inline'">
<title>TV Control</title>
<style>
:root { --surface: #1f1f1f; --raised: #383838; --muted: #b0b0b0; --danger: #ff7b7b; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 16px/1.25 system-ui, sans-serif; user-select: none; }
button, input { font: inherit; color: inherit; border: 0; }
button { background: var(--surface); touch-action: manipulation; }
button:active { background: #555; }
button:disabled { opacity: .4; }
input { width: 100%; height: 50px; padding: 0 14px; border-radius: 12px; background: var(--surface); user-select: text; outline: 0; }
input:focus { box-shadow: 0 0 0 2px #fff; }
svg { width: 44%; height: 44%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

#app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 14px 10px; }
header { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: flex; padding: 3px; gap: 2px; background: var(--surface); border-radius: 12px; }
.seg button { height: 42px; padding: 0 18px; border-radius: 9px; background: transparent; white-space: nowrap; }
.seg button[aria-pressed=true] { background: #fff; color: #000; font-weight: 600; }
#banner { flex: none; min-height: 40px; display: flex; align-items: center; gap: 12px; padding: 4px 14px; border-radius: 10px; background: var(--surface); font-size: 14px; }
#bannerText { flex: 1; }
#retry { height: 34px; padding: 0 16px; border-radius: 8px; background: var(--raised); font-weight: 600; }

main { flex: 1; min-height: 0; position: relative; container-type: size; }
.panel { position: absolute; inset: 0; display: none; }
.panel.on { display: block; }

#remote { --key: min(17.5cqh, 8.3cqw); --gap: min(2.4cqh, 1.2cqw); }
#remote.on { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 2cqw; align-items: center; }
.col { display: grid; gap: min(4cqh, 16px); align-content: center; }
.keys { display: grid; grid-template-columns: repeat(3, var(--key)); justify-content: space-between; align-items: center; }
.key { width: var(--key); height: var(--key); display: grid; place-items: center; border-radius: 50%; }
.vol { font-size: 13px; color: var(--muted); text-align: center; }
#pad { --cell: min(30cqh, 13.4cqw); display: grid; grid-template: repeat(3, var(--cell)) / repeat(3, var(--cell)); place-items: center; border-radius: 50%; background: var(--surface); }
#pad button { width: 100%; height: 100%; display: grid; place-items: center; background: transparent; border-radius: 50%; }
#pad button:active { background: #555; }
#pad .ok { background: var(--raised); font-weight: 700; font-size: 20px; }
#pad [data-key=up] { grid-area: 1 / 2; } #pad [data-key=left] { grid-area: 2 / 1; } #pad .ok { grid-area: 2 / 2; }
#pad [data-key=right] { grid-area: 2 / 3; } #pad [data-key=down] { grid-area: 3 / 2; }
.send { display: flex; gap: 8px; }
.send button { flex: 1; height: 48px; border-radius: 12px; font-weight: 600; }

#apps { overflow-y: auto; }
#inputs { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; }
.chip { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; }
#appGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tile { min-height: 104px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; }
.tile span:first-child { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--raised); font-size: 20px; font-weight: 700; }
.name { font-size: 13px; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note { color: var(--muted); font-size: 14px; }
#appsEmpty { text-align: center; padding-top: 80px; }
#refresh { position: sticky; float: right; top: 0; height: 40px; padding: 0 14px; margin-bottom: 8px; border-radius: 10px; }

#cast.on { display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; padding-top: 24px; }
#cast h2, #tv h2 { margin: 0; font-size: 20px; }
.field { display: flex; gap: 8px; }
.field button { flex: none; height: 50px; padding: 0 22px; border-radius: 12px; font-weight: 600; }

#tv.on { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-content: start; padding-top: 8px; }
#tv section { display: grid; gap: 10px; align-content: start; }
#actions { display: grid; gap: 8px; }
.row-btn { min-height: 54px; padding: 0 16px; border-radius: 12px; text-align: left; }
#danger { color: var(--danger); }

#away.on { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-content: start; padding-top: 4px; }
#away h2 { margin: 0; font-size: 20px; }
#away section { display: grid; gap: 8px; align-content: start; }
.setup-row { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 7px 0 14px; border-radius: 12px; background: var(--surface); }
.setup-row button { flex: none; height: 40px; padding: 0 16px; border-radius: 9px; background: var(--raised); font-weight: 600; }
#pair { height: 52px; border-radius: 12px; font-weight: 600; }
#pairCode { min-height: 52px; font-size: 38px; font-weight: 700; letter-spacing: 6px; text-align: center; user-select: text; }

#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 80%; padding: 12px 18px; border-radius: 12px; background: #fff; color: #000; font-size: 15px; z-index: 5; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
  <symbol id="i-input" viewBox="0 0 24 24"><path d="M3 5h18v12H3zM8 21h8M12 17v4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M6 9.5V20h12V9.5"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4v-13l-5 4zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m3 6 9 6-9 6zM16 6v12M21 6v12"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24"><path d="m13 6 8 6-8 6zM3 6l8 6-8 6z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4v-13l-5 4zM16 12h5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4v-13l-5 4zM16 12h5M18.5 9.5v5"/></symbol>
  <symbol id="c-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="c-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="c-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="c-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>
<div id="app">
  <header>
    <div class="seg" role="group" aria-label="Which TV">
      <button data-target="google">Google TV</button>
      <button data-target="lg">LG TV</button>
    </div>
    <nav class="seg" aria-label="Sections">
      <button data-tab="remote">Remote</button>
      <button data-tab="apps">Apps</button>
      <button data-tab="cast">Cast</button>
      <button data-tab="tv">TV</button>
      <button data-tab="away">Away</button>
    </nav>
  </header>
  <div id="banner" role="status" hidden><span id="bannerText"></span><button id="retry" hidden>Retry</button></div>
  <main>
    <section class="panel" id="remote">
      <div class="col">
        <div class="keys">
          <button class="key" data-key="power" aria-label="Power"><svg><use href="#i-power"/></svg></button>
          <button class="key" id="slotA" aria-label="Quick panel"><svg><use href="#i-grid"/></svg></button>
          <button class="key" id="slotB" aria-label="TV settings"><svg><use href="#i-gear"/></svg></button>
        </div>
        <div class="keys">
          <button class="key" data-key="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
          <button class="key" data-key="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
          <button class="key" data-key="mute" aria-label="Mute"><svg><use href="#i-mute"/></svg></button>
        </div>
        <div class="keys">
          <button class="key" data-key="volumeDown" aria-label="Volume down"><svg><use href="#i-down"/></svg></button>
          <span class="vol">Volume</span>
          <button class="key" data-key="volumeUp" aria-label="Volume up"><svg><use href="#i-up"/></svg></button>
        </div>
      </div>
      <div id="pad">
        <button data-key="up" aria-label="Up"><svg><use href="#c-up"/></svg></button>
        <button data-key="left" aria-label="Left"><svg><use href="#c-left"/></svg></button>
        <button class="ok" data-key="ok" aria-label="OK">OK</button>
        <button data-key="right" aria-label="Right"><svg><use href="#c-right"/></svg></button>
        <button data-key="down" aria-label="Down"><svg><use href="#c-down"/></svg></button>
      </div>
      <div class="col">
        <div class="keys">
          <button class="key" data-key="rewind" aria-label="Rewind"><svg><use href="#i-rew"/></svg></button>
          <button class="key" data-key="playPause" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
          <button class="key" data-key="forward" aria-label="Fast forward"><svg><use href="#i-ff"/></svg></button>
        </div>
        <input id="text" placeholder="Type on TV" aria-label="Type on TV" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
        <div class="send"><button id="send">Send</button><button id="search">Search</button></div>
      </div>
    </section>
    <section class="panel" id="apps">
      <button id="refresh">Refresh</button>
      <div id="inputs"></div>
      <p class="note" id="appsEmpty">Your TV's apps appear here once it's connected.</p>
      <div id="appGrid"></div>
    </section>
    <section class="panel" id="cast">
      <h2>Cast to TV</h2>
      <div class="field">
        <input id="link" type="url" placeholder="YouTube, Netflix or media link" aria-label="Link to cast" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="castBtn">Cast</button>
      </div>
      <p class="note" id="castStatus" role="status"></p>
    </section>
    <section class="panel" id="tv">
      <section><h2>Controls</h2><div id="actions"></div></section>
      <section>
        <h2>Connection</h2>
        <div class="field">
          <input id="address" inputmode="decimal" placeholder="TV Wi-Fi address" aria-label="TV Wi-Fi address" autocomplete="off">
          <button id="save">Save</button>
        </div>
        <button class="row-btn" id="danger"></button>
      </section>
    </section>
    <section class="panel" id="away">
      <section><h2>Echo setup</h2><div id="setup" style="display:grid;gap:7px"></div></section>
      <section>
        <h2>Connect your iPhone</h2>
        <p class="note" style="margin:0">Tailscale address</p>
        <div id="tailIp" style="font-size:20px;font-weight:600;user-select:text"></div>
        <button id="pair">Pair iPhone</button>
        <div id="pairCode" aria-live="polite"></div>
        <p class="note" style="margin:0">People near the Echo always see LIVE and hear a chime when the iPhone connects.</p>
      </section>
    </section>
  </main>
</div>
<div id="toast" role="alert" hidden></div>
<script src="proto.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
