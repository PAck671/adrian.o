name: TVControl
options:
  bundleIdPrefix: com.adriantools
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  TVControl:
    type: application
    platform: iOS
    sources:
      - path: TVControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriantools.tvcontrol
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # No entitlements file on purpose: free Apple IDs cannot sign paid capabilities.
    info:
      path: TVControl/Info.plist
      properties:
        CFBundleDisplayName: "TV Control"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "TV Control connects to your TV on your Wi-Fi so it can control it and cast to it."
        NSMicrophoneUsageDescription: "TV Control listens when you tap the microphone so you can search your TV by voice."
        NSSpeechRecognitionUsageDescription: "TV Control turns what you say into a search on your TV."
