name: PulseAndPlan
options:
  bundleIdPrefix: com.pulseandplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PulseAndPlan:
    type: application
    platform: iOS
    sources:
      - path: PulseAndPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulseandplan.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    # No entitlements file on purpose: free Apple IDs cannot sign paid capabilities.
    info:
      path: PulseAndPlan/Info.plist
      properties:
        CFBundleDisplayName: "Red Thread"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSCameraUsageDescription: "Red Thread uses the camera to record short video messages for your partner."
        NSMicrophoneUsageDescription: "Red Thread records audio with your video messages."
        NSPhotoLibraryUsageDescription: "Red Thread can save video messages to your photo library."
        NSLocationWhenInUseUsageDescription: "Red Thread shares your location with your partner while you use the app."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow Always so your partner keeps seeing where you are when the app is in the background. You can pause anytime with Ghost Mode."
        NSCalendarsFullAccessUsageDescription: "Red Thread reads when you're busy (never event titles) to find free time with your partner, and adds plans you make together to your calendar."
        NSCalendarsWriteOnlyAccessUsageDescription: "Red Thread adds plans you make together to your calendar."
        NSMotionUsageDescription: "Red Thread uses motion and fitness data to show your partner whether you're walking, driving, sitting or resting. Turn it off anytime in Settings."
  PulseAndPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseAndPlanTests
    dependencies:
      - target: PulseAndPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulseandplan.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PulseAndPlan:
    build:
      targets:
        PulseAndPlan: all
        PulseAndPlanTests: [test]
    test:
      targets:
        - PulseAndPlanTests
