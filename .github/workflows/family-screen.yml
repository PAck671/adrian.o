name: Build Family Screen

on:
  push:
    branches: ["**"]
    paths:
      - "FamilyScreen/**"
      - ".github/workflows/family-screen.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: FamilyScreen/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyScreen-android-apk
          path: FamilyScreen/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        working-directory: FamilyScreen/ios
        run: ./build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyScreen-unsigned-ipa
          path: FamilyScreen/ios/dist/FamilyScreen-unsigned.ipa
          if-no-files-found: error
